<header class="site-header">
  <a class="brand" href="{{ site.Home.RelPermalink }}"><img src="{{ "img/logo.png" | relURL }}" alt="{{ site.Title }}" width="1024" height="367"></a>
  <nav aria-label="{{ i18n "main_nav" }}">
    <ul>
      {{- range site.Menus.main }}
      <li><a href="{{ .URL }}"{{ if $.HasMenuCurrent "main" . }} aria-current="page"{{ end }}>{{ .Name }}</a></li>
      {{- end }}
    </ul>
  </nav>
  <div class="tools">
    {{- range .AllTranslations }}{{ if ne .Language.Lang site.Language.Lang }}
    <a href="{{ .RelPermalink }}" hreflang="{{ .Language.Lang }}" lang="{{ .Language.Lang }}" aria-label="{{ .Language.Label }}">{{ upper .Language.Lang }}</a>
    {{- end }}{{ end }}
    <button id="theme-toggle" type="button" aria-pressed="false" aria-label="{{ i18n "theme_toggle" }}"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg></button>
  </div>
</header>
